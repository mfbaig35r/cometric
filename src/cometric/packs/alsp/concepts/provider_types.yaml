  kind: null
  bases: []
  methods: []
  broader: []
  related: []
  evidence_class: A_DIRECT
  prevalence: UNVERIFIED
  claims: [CLM-A-0030, CLM-A-0048]
  caveats:
  - >-
    Legal-counsel review is required before treating any contingent, success-based,
    fee-sharing, regulated-work or cross-border outsourcing structure as permissible.
  source_ref: report:provider-type-matrix
  status: active
  attributes:
    us: Available only in certain jurisdictions and structures.
    england_wales: Express statutory framework exists under the Legal Services Act
      2007.
    commercial_implications: Broader ownership architecture, but regulated legal duties
      remain.
