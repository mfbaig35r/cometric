scheme: provider_types
title: Legal-services provider types
concepts:
- id: REGULATED_LAW_FIRM
  label: Regulated law firm
  synonyms: []
  definition: >-
    Provider type: regulated law firm. Contingent and outcome fees require legal review.
  kind: null
  bases: []
  methods: []
  broader: []
  related: []
  evidence_class: A_DIRECT
  prevalence: UNVERIFIED
  claims: [CLM-A-0027, CLM-A-0028, CLM-A-0029, CLM-A-0031, CLM-A-0048]
  caveats:
  - >-
    Legal-counsel review is required before treating any contingent, success-based,
    fee-sharing, regulated-work or cross-border outsourcing structure as permissible.
  source_ref: report:provider-type-matrix
  status: active
  attributes:
    us: >-
      State ethics rules; fee reasonableness; nonlawyer fee-sharing restrictions often
      applicable.
    england_wales: Regulator requirements for solicitors and other regulated lawyers.
    commercial_implications: Contingent and outcome fees require legal review.
- id: LICENSED_BODY
  label: Licensed body (alternative business structure)
  synonyms: []
  definition: >-
    Provider type: licensed body (alternative business structure). Broader ownership
