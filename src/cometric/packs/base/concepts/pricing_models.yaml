    source_basis: [BB-OUTCOME]
- id: PM-028
  label: Technology-enabled managed service
  synonyms: [tech-enabled managed service]
  definition: >-
    A service that bundles labor, platform, process and risk transfer, usually as
    a recurring charge with output or usage elements.
  kind: modifier
  bases: [FIXED, OUTPUT, USAGE]
  methods: [FIXED_RECURRING, UNIT_OUTPUT]
  broader: []
  related: [PM-007]
  evidence_class: A_DIRECT
  prevalence: ESTABLISHED_COMMON
  claims: [CLM-B-0043]
  caveats: []
  source_ref: report:PM-028
  status: active
  attributes:
    formula: null
    applications: Contracting, eDiscovery, operations, compliance.
    provider_client_economics: >-
      Bundles labor, platform, process and risk transfer; economically a configuration
