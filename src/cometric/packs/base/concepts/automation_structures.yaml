scheme: automation_structures
title: Structures for automation-reduced effort
concepts:
- id: AUTO-01
  label: Time plus technology fee
  synonyms: []
  definition: >-
    A defensible structure for pricing a service whose human effort has been sharply
    reduced by automation.
  kind: null
  bases: []
  methods: []
  broader: []
  related: [PM-001]
  evidence_class: C_INFERENCE
  prevalence: UNVERIFIED
  claims: [CLM-B-0032, CLM-B-0031]
  caveats: []
  source_ref: report:automation-structures
  status: active
  attributes:
    provider_perspective: Easy transition from legacy billing; technology cost recoverable.
    client_perspective: Transparent inputs.
    principal_risk: >-
      Client may expect full labor savings; provider monetizes less productivity upside.
    benefit_allocation_note: Benefit largely passes to the client through reduced
      hours.
    row: 1
- id: AUTO-02
  label: Fixed fee for defined output
  synonyms: []
  definition: >-
    A defensible structure for pricing a service whose human effort has been sharply
    reduced by automation.
  kind: null
  bases: []
  methods: []
  broader: []
  related: [PM-006, PM-007]
  evidence_class: C_INFERENCE
  prevalence: UNVERIFIED
  claims: [CLM-B-0032, CLM-B-0031]
  caveats: []
  source_ref: report:automation-structures
  status: active
  attributes:
    provider_perspective: Provider captures productivity improvements.
    client_perspective: Budget certainty and incentive for efficiency.
    principal_risk: Provider bears error, volume and scope risk.
    benefit_allocation_note: >-
      Benefit is provider-retained until competition or contract terms pass savings
      through.
    row: 2
- id: AUTO-03
  label: Per-contract or per-unit fee
  synonyms: []
  definition: >-
    A defensible structure for pricing a service whose human effort has been sharply
    reduced by automation.
  kind: null
  bases: []
  methods: []
  broader: []
  related: [PM-011, PM-012]
  evidence_class: C_INFERENCE
  prevalence: UNVERIFIED
  claims: [CLM-B-0032, CLM-B-0031]
  caveats: []
