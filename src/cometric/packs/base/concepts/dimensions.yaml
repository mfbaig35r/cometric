- id: DIM-01
  label: Billing basis
  synonyms: []
  definition: >-
    Commercial dimension 'billing basis', treated as a separate axis of an arrangement
    rather than a mutually exclusive model type.
  kind: null
  bases: []
  methods: []
  broader: []
  related: []
  evidence_class: C_INFERENCE
  prevalence: UNVERIFIED
  claims: [CLM-B-0001]
  caveats:
  - >-
    The core executes eight bases; MILESTONE maps to FIXED (or OUTPUT) with EVENT
    cadence.
  source_ref: report:dimensions
  status: active
  attributes:
    key: billing_basis
    values:
    - TIME
    - RESOURCE
    - CAPACITY
    - OUTPUT
    - USAGE
    - FIXED
    - MILESTONE
    - COST
    - OUTCOME
    independence: Primary
    derived: false
    row: 1
