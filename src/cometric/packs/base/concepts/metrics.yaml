- id: FM-018
  label: Contribution profit
  synonyms: []
  definition: Revenue less variable costs and engagement-avoidable fixed costs.
  kind: null
  bases: []
  methods: []
  broader: []
  related: []
  evidence_class: B_CORROBORATED
  prevalence: ESTABLISHED_COMMON
  claims: [CLM-B-0021]
  caveats:
  - >-
    Cometric's contribution_profit subtracts margin layers (DIRECT_DELIVERY and ENGAGEMENT_AVOIDABLE);
    it equals FM-018 only when all direct delivery costs are avoidable. The engine
    reports unavoidable direct cost separately so FM-018 can be reconstructed.
  source_ref: report:FM-018
  status: active
  attributes:
    formula: CP = Revenue - VariableCosts - EngagementAvoidableFixedCosts
    unit_period: currency
    limitation: Scope of 'avoidable' must be explicit.
    computed_by: contribution_profit
    requires: null
    family: financial
